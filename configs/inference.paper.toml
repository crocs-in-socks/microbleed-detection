[data]
modality = "T2*-GRE"
require_masks = false

preprocessing = "T2*-GRE"

[detector]
patch_size = 48
augmentation_factor = 1
probability_threshold = 0.2

[detector.architecture]
initial_channels = 64
output_classes = 2

[student]
patch_size = 24
augmentation_factor = 1
probability_threshold = 0.2
temperature = 4.0
alpha = 0.4
beta = 0.6

[student.architecture]
initial_channels = 64
output_classes = 2
dropout_rate = 0.2

[postprocessing]
minimum_volume_mm3 = 2.5
maximum_eccentricity = 0.2
minimum_boundary_distance_mm = 5.0

[evaluation]
detector_thresholds = [0.2]
discriminator_thresholds = [0.2]
