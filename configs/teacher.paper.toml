[data]
modality = "T2*-GRE"
require_masks = true

preprocessing = "T2*-GRE"

[augmentation]
translation_offset_range = [-15, 15]
noise_variance_range = [0.01, 0.04]
blur_sigma_range = [0.1, 0.2]

[detector]
patch_size = 48
augmentation_factor = 10
probability_threshold = 0.2

[detector.architecture]
initial_channels = 64
output_classes = 2

[teacher]
patch_size = 24
augmentation_factor = 5

[teacher.architecture]
initial_channels = 64
output_classes = 2
dropout_rate = 0.2

[trainer]
learning_rate = 0.001
adam_epsilon = 0.0001
weight_decay = 0.0
batch_size = 8
max_epochs = 100
patience = 20
learning_rate_factor = 0.1
learning_rate_period = 2
minimum_learning_rate = 1e-06

[postprocessing]
minimum_volume_mm3 = 2.5
maximum_eccentricity = 0.2
minimum_boundary_distance_mm = 5.0

[evaluation]
detector_thresholds = [0.2]
discriminator_thresholds = [0.2]
